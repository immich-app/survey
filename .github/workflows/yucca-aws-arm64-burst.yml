      BURST_TRIAL_ID: 56d2f379-43c5-4270-ae6b-659c067646a3
      BURST_BARRIER_URL: https://yucca-ci-aws-arm-burst-release-20261028.ian-b13.workers.dev/
    steps:
      - name: Verify native ARM64 readiness and hold until release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import platform
          import re
          import signal
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          POLL_SECONDS = 3
          MAX_WAIT_SECONDS = 10 * 60
          HTTP_TIMEOUT_SECONDS = 5
          MAX_FAILURES = 10
          MAX_BODY_BYTES = 1024
          RELEASE_HOLD_SECONDS = 5
          EXPECTED_TRIAL = "56d2f379-43c5-4270-ae6b-659c067646a3"
          EXPECTED_URL = "https://yucca-ci-aws-arm-burst-release-20261028.ian-b13.workers.dev/"
          started = time.monotonic()
          index = int(os.environ["BURST_INDEX"])
          assert 1 <= index <= 200
          assert os.environ["BURST_TRIAL_ID"] == EXPECTED_TRIAL
          assert os.environ["BURST_BARRIER_URL"] == EXPECTED_URL
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert os.environ.get("GITHUB_SERVER_URL") == "https://github.com"
          assert os.environ.get("GITHUB_REPOSITORY") == "immich-app/survey"
          assert os.environ.get("GITHUB_REF") == "refs/heads/ci/aws-arm64-canary-20261028"
          assert re.fullmatch(r"[1-9][0-9]*", os.environ.get("GITHUB_RUN_ID", ""))
          assert re.fullmatch(r"[1-9][0-9]*", os.environ.get("GITHUB_RUN_ATTEMPT", ""))
          assert re.fullmatch(r"[a-f0-9]{40}", os.environ.get("GITHUB_SHA", ""))
          assert os.environ.get("RUNNER_OS") == "Linux"
          assert os.environ.get("RUNNER_ARCH") == "ARM64"
          assert platform.machine() == "aarch64"
          forbidden = (
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN",
              "AWS_SECURITY_TOKEN", "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI",
              "AWS_CONTAINER_CREDENTIALS_FULL_URI", "AWS_WEB_IDENTITY_TOKEN_FILE",
              "CI_ALLOCATION_TOKEN", "GITHUB_APP_PRIVATE_KEY",
          )
          assert not any(key in os.environ for key in forbidden), "Controller credential reached job environment"
          common = {
              "schema": 1,
              "index": index,
              "trial_id": EXPECTED_TRIAL,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "runner_name": os.environ["RUNNER_NAME"],
              "boot_id": Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
              "architecture": platform.machine(),
          }

          def emit(kind, **fields):
              print("YUCCA_AWS_ARM64_BURST_JSON " + json.dumps({
                  **common, "kind": kind,
                  "utc": datetime.now(timezone.utc).isoformat(),
                  "elapsed_seconds": round(time.monotonic() - started, 6),
                  **fields,
              }, sort_keys=True), flush=True)

          def cancelled(signum, _frame):
              emit("cancelled", signal=signal.Signals(signum).name)
              sys.exit(128 + signum)

          signal.signal(signal.SIGTERM, cancelled)
          signal.signal(signal.SIGINT, cancelled)
          emit("start")
          node_arch = subprocess.check_output(["node", "-p", "process.arch"], text=True, timeout=10).strip()
          assert node_arch == "arm64"
          node_version = subprocess.check_output(["node", "--version"], text=True, timeout=10).strip()
          git_version = subprocess.check_output(["git", "--version"], text=True, timeout=10).strip()
          subprocess.run(["cc", "--version"], check=True, stdout=subprocess.DEVNULL, timeout=10)
          emit("ready", hardware={
              "cpu_affinity_count": len(os.sched_getaffinity(0)),
              "memory_total_bytes": next(int(line.split()[1]) * 1024 for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemTotal:")),
          }, tools={"node": node_version, "python": platform.python_version(), "git": git_version})
          request = urllib.request.Request(EXPECTED_URL, headers={
              "User-Agent": "yucca-ci-aws-arm-burst/1",
              "Cache-Control": "no-cache",
          })
          deadline = time.monotonic() + MAX_WAIT_SECONDS
          polls, failures, consecutive_failures = 0, 0, 0
          status = "wait_timeout"
          while time.monotonic() < deadline:
              polls += 1
              try:
                  with urllib.request.urlopen(request, timeout=HTTP_TIMEOUT_SECONDS) as response:
                      raw = response.read(MAX_BODY_BYTES + 1)
                      if response.status != 200 or len(raw) > MAX_BODY_BYTES:
                          raise ValueError()
                  body = json.loads(raw)
                  if (not isinstance(body, dict) or
                          set(body) != {"trial_id", "released", "expires_at"} or
                          body["trial_id"] != EXPECTED_TRIAL or
                          type(body["released"]) is not bool or
                          not isinstance(body["expires_at"], str)):
                      raise ValueError()
                  expires = datetime.fromisoformat(body["expires_at"].replace("Z", "+00:00"))
                  if expires.utcoffset() is None:
                      raise ValueError()
              except (OSError, ValueError, urllib.error.URLError):
                  failures += 1
                  consecutive_failures += 1
                  if consecutive_failures >= MAX_FAILURES:
                      status = "barrier_unavailable"
                      break
              else:
                  consecutive_failures = 0
                  if datetime.now(timezone.utc) >= expires:
                      status = "barrier_expired"
                      break
                  if body["released"]:
                      status = "released"
                      emit("released", polls=polls, barrier_failures=failures)
                      time.sleep(RELEASE_HOLD_SECONDS)
                      break
              time.sleep(min(POLL_SECONDS, max(0, deadline - time.monotonic())))
          emit("finished", status=status, exit_code=0 if status == "released" else 1,
               polls=polls, barrier_failures=failures)
          raise SystemExit(0 if status == "released" else 1)
          PY
