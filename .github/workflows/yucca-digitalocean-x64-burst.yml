      BURST_TRIAL_ID: 03937f0e-e7ce-4e68-a868-94b7a995997e
      BURST_BARRIER_URL: https://yucca-ci-do-x64-release-20261102.ian-b13.workers.dev
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify fresh x64 runner and hold at the external barrier
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import platform
          import re
          import signal
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          EXPECTED_TRIAL = "03937f0e-e7ce-4e68-a868-94b7a995997e"
          EXPECTED_URL = "https://yucca-ci-do-x64-release-20261102.ian-b13.workers.dev"
          POLL_SECONDS = 3
          MAX_WAIT_SECONDS = 10 * 60
          HTTP_TIMEOUT_SECONDS = 5
          MAX_FAILURES = 10
          MAX_BODY_BYTES = 1024
          RELEASE_HOLD_SECONDS = 30
          started = time.monotonic()
          index = int(os.environ["BURST_INDEX"])
          assert 1 <= index <= 200
          assert os.environ["BURST_TRIAL_ID"] == EXPECTED_TRIAL
          assert os.environ["BURST_BARRIER_URL"] == EXPECTED_URL
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert os.environ.get("GITHUB_SERVER_URL") == "https://github.com"
          assert os.environ.get("GITHUB_REPOSITORY") == "immich-app/survey"
          assert os.environ.get("GITHUB_REF") == "refs/heads/ci/digitalocean-x64-canary-20261102"
          assert re.fullmatch(r"[1-9][0-9]*", os.environ.get("GITHUB_RUN_ID", ""))
          assert re.fullmatch(r"[1-9][0-9]*", os.environ.get("GITHUB_RUN_ATTEMPT", ""))
          assert re.fullmatch(r"[a-f0-9]{40}", os.environ.get("GITHUB_SHA", ""))
          assert os.environ.get("RUNNER_OS") == "Linux" and os.environ.get("RUNNER_ARCH") == "X64"
          assert platform.machine() == "x86_64"
          assert os.getuid() == os.geteuid() == os.getgid() == os.getegid() == 1000
          status = dict(line.split(":", 1) for line in Path("/proc/self/status").read_text().splitlines() if ":" in line)
          assert status["NoNewPrivs"].strip() == "1"
          assert all(int(status[key].strip(), 16) == 0 for key in ("CapInh", "CapPrm", "CapEff", "CapBnd", "CapAmb"))
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          assert workspace.is_dir() and not list(workspace.iterdir()), "Workspace was not fresh"
          forbidden = (
              "DIGITALOCEAN_TOKEN", "DIGITALOCEAN_ACCESS_TOKEN", "DO_TOKEN",
              "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN",
              "AWS_CONTAINER_CREDENTIALS_RELATIVE_URI", "AWS_CONTAINER_CREDENTIALS_FULL_URI",
              "AWS_WEB_IDENTITY_TOKEN_FILE", "FLY_API_TOKEN", "SPRITES_TOKEN",
              "CLOUDFLARE_API_TOKEN", "CF_API_TOKEN", "CI_ALLOCATION_TOKEN", "GITHUB_APP_PRIVATE_KEY",
          )
          assert not any(key in os.environ for key in forbidden), "Controller credential reached job"
          common = {
              "schema": 1, "index": index, "trial_id": EXPECTED_TRIAL,
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"], "workflow_commit": os.environ["GITHUB_SHA"],
              "runner_name": os.environ["RUNNER_NAME"], "architecture": platform.machine(),
              "boot_id": Path("/proc/sys/kernel/random/boot_id").read_text().strip(),
          }
          def emit(kind, **fields):
              print("DO_BURST_JSON " + json.dumps({**common, "kind": kind,
                  "utc": datetime.now(timezone.utc).isoformat(),
                  "elapsed_seconds": round(time.monotonic() - started, 6), **fields}, sort_keys=True), flush=True)
          def cancelled(signum, _frame):
              emit("cancelled", signal=signal.Signals(signum).name)
              sys.exit(128 + signum)
          signal.signal(signal.SIGTERM, cancelled)
          signal.signal(signal.SIGINT, cancelled)
          emit("start")
          node = subprocess.check_output(["node", "--version"], text=True, timeout=10).strip()
          assert node.startswith("v24.")
          assert subprocess.check_output(["node", "-p", "process.arch"], text=True, timeout=10).strip() == "x64"
          git = subprocess.check_output(["git", "--version"], text=True, timeout=10).strip()
          subprocess.run(["cc", "--version"], check=True, stdout=subprocess.DEVNULL, timeout=10)
          emit("ready", hardware={"cpu_affinity_count": len(os.sched_getaffinity(0)),
              "memory_total_bytes": next(int(line.split()[1]) * 1024 for line in Path("/proc/meminfo").read_text().splitlines() if line.startswith("MemTotal:"))},
              tools={"node": node, "python": platform.python_version(), "git": git})
          request = urllib.request.Request(EXPECTED_URL, headers={"User-Agent": "yucca-ci-do-burst/1", "Cache-Control": "no-cache"})
          deadline = time.monotonic() + MAX_WAIT_SECONDS
          polls, failures, consecutive_failures = 0, 0, 0
          result = "wait_timeout"
          while time.monotonic() < deadline:
              polls += 1
              try:
                  with urllib.request.urlopen(request, timeout=HTTP_TIMEOUT_SECONDS) as response:
                      raw = response.read(MAX_BODY_BYTES + 1)
                      if response.status != 200 or len(raw) > MAX_BODY_BYTES:
                          raise ValueError()
                  body = json.loads(raw)
                  if (not isinstance(body, dict) or set(body) != {"trial_id", "released", "expires_at"} or
                          body["trial_id"] != EXPECTED_TRIAL or type(body["released"]) is not bool or
                          not isinstance(body["expires_at"], str)):
                      raise ValueError()
                  expires = datetime.fromisoformat(body["expires_at"].replace("Z", "+00:00"))
                  if expires.utcoffset() is None:
                      raise ValueError()
              except (OSError, ValueError, urllib.error.URLError):
                  failures += 1
                  consecutive_failures += 1
                  if consecutive_failures >= MAX_FAILURES:
                      result = "barrier_unavailable"
                      break
              else:
                  consecutive_failures = 0
                  if datetime.now(timezone.utc) >= expires:
                      result = "barrier_expired"
                      break
                  if body["released"]:
                      result = "released"
                      emit("released", polls=polls, barrier_failures=failures, hold_seconds=RELEASE_HOLD_SECONDS)
                      time.sleep(RELEASE_HOLD_SECONDS)
                      emit("overlap_hold_finished", hold_seconds=RELEASE_HOLD_SECONDS)
                      break
              time.sleep(min(POLL_SECONDS, max(0, deadline - time.monotonic())))
          emit("barrier_finished", status=result, polls=polls, barrier_failures=failures)
          raise SystemExit(0 if result == "released" else 1)
          PY

      - name: Compile and hash a native executable on every runner
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/do-x64-burst.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          cat > "$work/probe.c" <<'C'
          #include <inttypes.h>
          #include <stdint.h>
          #include <stdio.h>
          #if !defined(__x86_64__)
          #error "Native x86_64 compiler required"
          #endif
          int main(void) {
            uint64_t value = UINT64_C(0x123456789abcdef0);
            for (uint64_t i = 0; i < UINT64_C(4000000); i++) {
              value ^= value >> 12; value ^= value << 25; value ^= value >> 27;
              value *= UINT64_C(2685821657736338717);
            }
            printf("DO_X64_CPU_OK:%016" PRIx64 "\n", value);
            return 0;
          }
          C
          cc -std=c11 -O2 -Wall -Wextra -Werror "$work/probe.c" -o "$work/probe"
          "$work/probe" > "$work/result.txt"
          python3 - "$work/probe" "$work/result.txt" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          program = Path(sys.argv[1]).read_bytes()
          assert program[:6] == b"\x7fELF\x02\x01" and program[18:20] == b"\x3e\x00"
          result = Path(sys.argv[2]).read_text().strip()
          value = 0x123456789abcdef0
          mask = (1 << 64) - 1
          for _ in range(4000000):
              value ^= value >> 12
              value ^= (value << 25) & mask
              value ^= value >> 27
              value = value * 2685821657736338717 & mask
          assert result == f"DO_X64_CPU_OK:{value:016x}"
          print("DO_BURST_JSON " + json.dumps({"kind": "cpu_verified", "utc": datetime.now(timezone.utc).isoformat(),
              "trial_id": os.environ["BURST_TRIAL_ID"], "index": int(os.environ["BURST_INDEX"]),
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"], "runner_name": os.environ["RUNNER_NAME"],
              "program_sha256": hashlib.sha256(program).hexdigest(), "iterations": 4000000}, sort_keys=True), flush=True)
          PY

      - name: Exercise native multi-stage Buildx on eight runners
        if: ${{ matrix.index <= 8 }}
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/do-x64-burst-buildx.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          docker buildx inspect do-ci | grep -Eq '^Driver:[[:space:]]+remote$'
          cat > "$work/probe.c" <<'C'
          #include <stdio.h>
          #include <string.h>
          #if !defined(__x86_64__)
          #error "Native x86_64 compiler required"
          #endif
          int main(int argc, char **argv) {
            if (argc != 2 || strcmp(argv[1], "build")) return 2;
            FILE *file = fopen("/proof.txt", "w");
            if (!file || fputs("DO_X64_BUILDX_OK\n", file) < 0 || fclose(file)) return 1;
            return 0;
          }
          C
          cc -static -std=c11 -O2 -Wall -Wextra -Werror "$work/probe.c" -o "$work/probe"
          cat > "$work/Dockerfile" <<'DOCKERFILE'
          FROM scratch AS build
          COPY probe /probe
          RUN ["/probe", "build"]
          FROM scratch
          COPY --from=build /proof.txt /proof.txt
          DOCKERFILE
          docker buildx --builder do-ci build --progress=plain --no-cache --platform=linux/amd64 \
            --output "type=local,dest=$work/result" "$work"
          test "$(cat "$work/result/proof.txt")" = DO_X64_BUILDX_OK
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          print("DO_BURST_JSON " + json.dumps({"kind": "buildx_verified", "utc": datetime.now(timezone.utc).isoformat(),
              "trial_id": os.environ["BURST_TRIAL_ID"], "index": int(os.environ["BURST_INDEX"]),
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "job": os.environ["GITHUB_JOB"], "runner_name": os.environ["RUNNER_NAME"]}, sort_keys=True), flush=True)
          PY

      - name: Record successful native job completion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          print("DO_BURST_JSON " + json.dumps({"kind": "finished", "status": "success",
              "utc": datetime.now(timezone.utc).isoformat(), "trial_id": os.environ["BURST_TRIAL_ID"],
              "index": int(os.environ["BURST_INDEX"]), "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "job": os.environ["GITHUB_JOB"],
              "runner_name": os.environ["RUNNER_NAME"]}, sort_keys=True), flush=True)
          PY
