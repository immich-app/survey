name: Yucca DigitalOcean native x64 200-job burst

on:
  push:
    branches:
      - ci/digitalocean-x64-canary-20261102
    paths:
      - .github/workflows/yucca-digitalocean-x64-burst.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: yucca-digitalocean-x64-burst-20261102
  cancel-in-progress: false

