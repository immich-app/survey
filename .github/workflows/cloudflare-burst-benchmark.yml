name: Yucca 200 native runner burst benchmark

on:
  push:
    branches:
      - ci/cloudflare-burst-standard-3-20261023
  workflow_dispatch:
    inputs:
      shape:
        description: Native runner shape
        required: true
        type: choice
        options:
          - standard-3

permissions: {}

concurrency:
  group: yucca-native-200-burst
  cancel-in-progress: false

