    steps:
      # Keep the marker/step names compatible with the benchmark log collector.
      # Each runner releases itself after 180 seconds; no shared barrier is used.
      # Capture startup, simultaneous execution and automatic cleanup together.
      - name: Record native readiness and hold until release
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          HOLD_SECONDS = 180
          expected_trial = "ecfe12dc-be4c-45b2-b278-d284f9ccd89b"
          common = {
              "schema": 1, "index": int(os.environ["BURST_INDEX"]),
              "shape": os.environ["BURST_SHAPE"], "trial_id": expected_trial,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow_commit": os.environ["GITHUB_SHA"],
              "release_mode": "fixed_hold", "hold_seconds": HOLD_SECONDS,
          }

          def emit(kind, **fields):
              print("YUCCA_BURST_JSON " + json.dumps({
                  **common, "kind": kind,
                  "utc": datetime.now(timezone.utc).isoformat(), **fields,
              }, sort_keys=True), flush=True)

          def read(path):
              try:
                  return Path(path).read_text().strip()
              except OSError:
                  return ""

          def disk(path):
              info = os.statvfs(path)
              return {"total_bytes": info.f_blocks * info.f_frsize,
                      "available_bytes": info.f_bavail * info.f_frsize}

          def cgroup_scope():
              root = Path("/sys/fs/cgroup")
              relative = next((line.partition("::")[2] for line in read("/proc/self/cgroup").splitlines() if line.startswith("0::")), "")
              current = (root / relative.lstrip("/")).resolve()
              if not current.is_relative_to(root):
                  return root
              while current != root and not (current / "memory.max").is_file():
                  current = current.parent
              return current

          def limit(path):
              value = read(path)
              return value if value == "max" or all(part.isdecimal() or part == "max" for part in value.split()) else "unknown"

          if (os.environ["BURST_TRIAL_ID"] != expected_trial or
                  common["shape"] not in {"standard-3"} or
                  not 1 <= common["index"] <= 200):
              raise SystemExit("Burst configuration invalid")
          scope = cgroup_scope()
          started = time.monotonic()
          emit("ready", hardware={
              "affinity": sorted(os.sched_getaffinity(0)),
              "cgroup_cpu_max": limit(scope / "cpu.max"),
              "cgroup_memory_max": limit(scope / "memory.max"),
              "mem_total_bytes": next((int(line.split()[1]) * 1024 for line in read("/proc/meminfo").splitlines() if line.startswith("MemTotal:")), None),
              "workspace_filesystem": disk(os.environ["GITHUB_WORKSPACE"]),
              "temporary_filesystem": disk(os.environ["RUNNER_TEMP"]),
          })
          time.sleep(HOLD_SECONDS)
          emit("finished", status="released", exit_code=0,
               wait_seconds=round(time.monotonic() - started, 6))
          PY
